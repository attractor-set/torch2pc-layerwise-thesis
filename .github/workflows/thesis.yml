name: Thesis

on:
  pull_request:
    paths:
      - "thesis/**"
      - "references/**"
      - "results/**"
      - "Makefile"
      - "scripts/build_thesis_assets.py"
      - ".github/workflows/thesis.yml"

  push:
    branches:
      - main
    paths:
      - "thesis/**"
      - "references/**"
      - "results/**"
      - "Makefile"
      - "scripts/build_thesis_assets.py"
      - ".github/workflows/thesis.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thesis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-thesis:
    name: Build dissertation PDF
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate thesis-facing evidence
        run: |
          python3 scripts/build_thesis_assets.py --check

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            biber \
            texlive-xetex \
            texlive-latex-extra \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-lang-cyrillic \
            fonts-liberation \
            poppler-utils

      - name: Toolchain identity
        run: |
          echo "=== SOURCE ==="
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

          echo
          echo "=== LATEX ==="
          latexmk -v
          xelatex --version | head -n 2
          biber --version

      - name: Build thesis
        run: |
          make thesis

      - name: Verify PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pdf = Path("thesis/main.pdf")

          checks = {
              "THESIS_PDF_EXISTS": pdf.is_file(),
              "THESIS_PDF_NONEMPTY": pdf.is_file() and pdf.stat().st_size > 0,
              "THESIS_PDF_MAGIC": (
                  pdf.is_file()
                  and pdf.read_bytes()[:5] == b"%PDF-"
              ),
          }

          for name, value in checks.items():
              print(f"{name}={'PASS' if value else 'FAIL'}")

          if not all(checks.values()):
              raise SystemExit(2)
          PY

      - name: PDF metadata
        run: |
          pdfinfo thesis/main.pdf

      - name: Artifact identity
        run: |
          sha256sum thesis/main.pdf | tee thesis/main.pdf.sha256

          echo
          printf 'SOURCE_COMMIT='
          git rev-parse HEAD

          printf 'SOURCE_TREE='
          git rev-parse HEAD^{tree}

          printf 'THESIS_PDF_SHA256='
          sha256sum thesis/main.pdf | cut -d' ' -f1

      - name: Upload dissertation PDF
        uses: actions/upload-artifact@v7
        with:
          name: dissertation-${{ github.sha }}
          path: |
            thesis/main.pdf
            thesis/main.pdf.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload LaTeX log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dissertation-build-log-${{ github.sha }}
          path: |
            thesis/main.log
            thesis/main.blg
          if-no-files-found: ignore
          retention-days: 14
