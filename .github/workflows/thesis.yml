name: Thesis

on:
  pull_request:
    paths:
      - "thesis/**"
      - "references/**"
      - "docs/glossary.md"
      - "docs/glossary_EN.md"
      - "results/**"
      - "Makefile"
      - "scripts/build_thesis_assets.py"
      - "scripts/check_thesis_semantic_contract.py"
      - "tests/unit/test_thesis_semantic_contract.py"
      - ".github/workflows/thesis.yml"

  push:
    branches:
      - main
    paths:
      - "thesis/**"
      - "references/**"
      - "docs/glossary.md"
      - "docs/glossary_EN.md"
      - "results/**"
      - "Makefile"
      - "scripts/build_thesis_assets.py"
      - "scripts/check_thesis_semantic_contract.py"
      - "tests/unit/test_thesis_semantic_contract.py"
      - ".github/workflows/thesis.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thesis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-thesis:
    name: Build dissertation PDF
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate thesis-facing evidence
        run: |
          python3 scripts/build_thesis_assets.py --check

      - name: Validate thesis semantic contract
        run: |
          python3 scripts/check_thesis_semantic_contract.py

      - name: Validate epistemic language
        run: |
          python3 scripts/check_epistemic_language.py

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            biber \
            texlive-xetex \
            texlive-latex-extra \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-lang-cyrillic \
            fonts-liberation \
            poppler-utils

      - name: Toolchain identity
        run: |
          echo "=== SOURCE ==="
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

          echo
          echo "=== LATEX ==="
          latexmk -v
          xelatex --version | head -n 2
          biber --version

      - name: Build thesis
        run: |
          make thesis

      - name: Verify LaTeX references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          log = Path("thesis/main.log").read_text(encoding="utf-8", errors="replace")
          blg_path = Path("thesis/main.blg")
          blg = blg_path.read_text(encoding="utf-8", errors="replace") if blg_path.is_file() else ""

          findings = []
          for marker in (
              "There were undefined references.",
              "There were undefined citations.",
          ):
              if marker in log:
                  findings.append(marker)
          for line in log.splitlines():
              if "LaTeX Warning:" in line and "undefined" in line:
                  findings.append(line.strip())
          for line in blg.splitlines():
              if "WARN -" in line and "database entry" in line:
                  findings.append(line.strip())

          print(f"THESIS_UNRESOLVED_REFERENCE_COUNT={len(findings)}")
          for finding in findings:
              print(f"THESIS_REFERENCE_FINDING={finding}")
          print(f"THESIS_REFERENCES={'PASS' if not findings else 'FAIL'}")
          if findings:
              raise SystemExit(2)
          PY

      - name: Audit typography
        run: |
          python3 - <<'PY'
          from pathlib import Path

          log = Path("thesis/main.log").read_text(encoding="utf-8", errors="replace")
          overfull = [line.strip() for line in log.splitlines() if "Overfull" in line and "hbox" in line]
          underfull = [line.strip() for line in log.splitlines() if "Underfull" in line and "hbox" in line]

          print(f"THESIS_OVERFULL_COUNT={len(overfull)}")
          print(f"THESIS_UNDERFULL_COUNT={len(underfull)}")
          for finding in overfull:
              print(f"THESIS_OVERFULL_FINDING={finding}")
          print(f"THESIS_TYPOGRAPHY={'PASS' if not overfull else 'FAIL'}")
          if overfull:
              raise SystemExit(2)
          PY

      - name: Verify PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pdf = Path("thesis/main.pdf")

          checks = {
              "THESIS_PDF_EXISTS": pdf.is_file(),
              "THESIS_PDF_NONEMPTY": pdf.is_file() and pdf.stat().st_size > 0,
              "THESIS_PDF_MAGIC": (
                  pdf.is_file()
                  and pdf.read_bytes()[:5] == b"%PDF-"
              ),
          }

          for name, value in checks.items():
              print(f"{name}={'PASS' if value else 'FAIL'}")

          if not all(checks.values()):
              raise SystemExit(2)
          PY

      - name: PDF metadata
        run: |
          pdfinfo thesis/main.pdf

      - name: Artifact identity
        run: |
          sha256sum thesis/main.pdf | tee thesis/main.pdf.sha256

          echo
          printf 'SOURCE_COMMIT='
          git rev-parse HEAD

          printf 'SOURCE_TREE='
          git rev-parse HEAD^{tree}

          printf 'THESIS_PDF_SHA256='
          sha256sum thesis/main.pdf | cut -d' ' -f1

      - name: Upload dissertation PDF
        uses: actions/upload-artifact@v7
        with:
          name: dissertation-${{ github.sha }}
          path: |
            thesis/main.pdf
            thesis/main.pdf.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload LaTeX log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dissertation-build-log-${{ github.sha }}
          path: |
            thesis/main.log
            thesis/main.blg
          if-no-files-found: ignore
          retention-days: 14
